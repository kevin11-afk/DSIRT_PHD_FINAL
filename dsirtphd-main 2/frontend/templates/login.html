<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PhD Entrance Examination</title>
  <meta name="description" content="Secure candidate login portal for the PhD Entrance Examination. Sign in with your registered email and issued credentials.">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=20260921">
</head>

<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/static/img/logo.png" alt="University Logo" class="university-logo" style="height: 96px; margin: 0 auto;" onerror="this.style.display='none'">
      </div>
      <div class="eyebrow">PhD Entrance Examination</div>
      <h1>Secure login</h1>
      <p class="sub">Sign in with the credentials issued by your department.</p>

      <div class="form-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password">Password</label>
            <button type="button" id="togglePasswordBtn" style="background:none; border:none; color:var(--text-faint); font-size:12px; cursor:pointer; padding:0;">Show password</button>
          </div>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width:100%; padding:12px;">Sign in</button>
      </form>

      <div id="demoLoginsBox" class="demo-logins" style="display: none; margin-top: 20px; padding: 12px; background: rgba(0, 0, 0, 0.025); border: 1px solid var(--border-subtle, #e2e8f0); border-radius: 8px; font-size: 12px;">
        <div style="font-weight: 600; margin-bottom: 8px; color: var(--text-subtle, #475569); display: flex; align-items: center; justify-content: space-between;">
          <span>Quick Demo Sign-In:</span>
          <span style="font-size: 11px; font-weight: normal; color: var(--text-faint, #64748b);">Click to auto-fill</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button type="button" class="btn btn-outline btn-sm quick-fill-btn" data-email="admin@examportal.edu" data-pass="Admin@123" style="text-align: left; font-size: 12px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 6px;">
            <span><strong>Admin:</strong> admin@examportal.edu</span>
            <span style="color: var(--text-faint); font-family: monospace;">Admin@123</span>
          </button>
          <button type="button" class="btn btn-outline btn-sm quick-fill-btn" data-email="candidate@examportal.edu" data-pass="dsirt@123" style="text-align: left; font-size: 12px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 6px;">
            <span><strong>Candidate:</strong> candidate@examportal.edu</span>
            <span style="color: var(--text-faint); font-family: monospace;">dsirt@123</span>
          </button>
          <button type="button" class="btn btn-outline btn-sm quick-fill-btn" data-email="setter@examportal.edu" data-pass="Setter@12345" style="text-align: left; font-size: 12px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 6px;">
            <span><strong>Paper Setter:</strong> setter@examportal.edu</span>
            <span style="color: var(--text-faint); font-family: monospace;">Setter@12345</span>
          </button>
        </div>
      </div>

      <p class="form-hint" style="margin-top:16px; text-align: center; color: var(--text-faint); font-size: 13px;">
        If you have trouble signing in, contact your examination coordinator.
      </p>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
