<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Dashboard — Ph.D Entrance Examination</title>
  <meta name="description" content="Ph.D Entrance Examination candidate dashboard. View your exam schedule and start your examination phases.">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=20260921">
  <style>
    /* ===== Candidate Dashboard — white/light theme ===== */
    /* Uses the same design-system tokens as login.html / admin pages */

    @media (max-width: 600px) { .dash-header { padding: 0 1rem !important; } .dash-subtitle, .candidate-badge { display: none; } .dash-main { margin: 1rem auto !important; padding: 0 0.8rem 3rem !important; } .info-card { padding: 1.2rem !important; } .exam-schedule-block { text-align: left !important; } .countdown-display { font-size: 2rem !important; } }
    .dash-header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--header-border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(15,23,42,.25);
    }
    .dash-header-left { display: flex; align-items: center; gap: 12px; }
    .dash-logo { height: 36px; border-radius: 6px; }
    .dash-title { font-size: 1rem; font-weight: 600; color: #ffffff; }
    .dash-subtitle { font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .dash-header-right { display: flex; align-items: center; gap: 12px; }
    .candidate-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      color: #fff;
      font-weight: 500;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #fca5a5; color: #fca5a5; }

    .dash-main {
      max-width: 860px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* Info card */
    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .info-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .info-candidate-name { font-size: 1.4rem; font-weight: 700; color: var(--text); font-family: var(--font-serif); }
    .info-candidate-email { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
    .exam-schedule-block { text-align: right; }
    .exam-schedule-label { font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
    .exam-schedule-time { font-size: 1rem; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .exam-schedule-date { font-size: 0.82rem; color: var(--text-faint); }

    /* Status ribbon */
    .status-ribbon {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 1.2rem;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status-ribbon.waiting  { background: var(--warning-soft); border: 1px solid #fcd34d; color: #92400e; }
    .status-ribbon.open     { background: var(--success-soft); border: 1px solid #6ee7b7; color: #065f46; }
    .status-ribbon.closed   { background: var(--danger-soft);  border: 1px solid #fca5a5; color: #991b1b; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .status-dot.pulse { animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
    .countdown-display {
      font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--warning); margin-top: 0.4rem;
      letter-spacing: 0.02em;
    }

    /* Phase cards */
    .phases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 600px) { .phases-grid { grid-template-columns: 1fr; } }

    .phase-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s;
    }
    .phase-card.active-phase  { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.12), var(--shadow-md); }
    .phase-card.completed-phase { border-color: var(--success); border-top: 3px solid var(--success); }
    .phase-card.locked-phase { opacity: 0.55; }

    .phase-number {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--text-faint);
    }
    .phase-title { font-size: 1.05rem; font-weight: 600; color: var(--text); margin-top: 2px; font-family: var(--font-serif); }
    .phase-questions { font-size: 0.82rem; color: var(--text-muted); }

    .phase-status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600;
      width: fit-content;
    }
    .phase-status-badge.not-started { background: #f1f5f9; color: var(--text-faint); border: 1px solid var(--border); }
    .phase-status-badge.in-progress { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-mid); }
    .phase-status-badge.completed   { background: var(--success-soft); color: var(--success-dark); border: 1px solid #6ee7b7; }
    .phase-status-badge.locked      { background: #f8fafc; color: var(--text-faint); border: 1px solid var(--border-soft); }

    .phase-completed-time { font-size: 0.78rem; color: var(--text-faint); }

    .phase-btn {
      width: 100%;
      padding: 0.75rem 1.2rem;
      border-radius: var(--radius-control);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .phase-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .phase-btn-start  { background: var(--accent); color: #fff; box-shadow: var(--shadow-md); }
    .phase-btn-start:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .phase-btn-resume { background: linear-gradient(135deg, #0ea5e9 0%, var(--accent) 100%); color: #fff; box-shadow: var(--shadow-md); }
    .phase-btn-resume:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .phase-btn-done { background: var(--success-soft); color: var(--success-dark); border: 1px solid #6ee7b7; cursor: default; font-weight: 600; }

    /* Instructions notice */
    .notice-card {
      background: var(--accent-soft);
      border: 1px solid var(--accent-mid);
      border-radius: var(--radius-control);
      padding: 1rem 1.2rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    /* Error state */
    .dash-error {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      border-radius: var(--radius-control);
      color: #b91c1c;
      padding: 1rem 1.2rem;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 1.2rem;
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-line { height: 14px; width: 100%; border-radius: 4px; }
    .loading-overlay { min-height: 200px; display: flex; align-items: center; justify-content: center; }

    /* Disqualified / completed notice */
    .terminal-notice {
      background: var(--panel);
      border-radius: var(--radius-card);
      padding: 2.5rem;
      text-align: center;
      border: 1px solid var(--border);
      margin-top: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .terminal-notice.success { border-color: #6ee7b7; border-top: 3px solid var(--success); }
    .terminal-notice.disqual { border-color: #fca5a5; border-top: 3px solid var(--danger); }
    .terminal-icon { font-size: 3rem; margin-bottom: 1rem; }
    .terminal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; font-family: var(--font-serif); }
    .terminal-body { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; max-width: 520px; margin: 0 auto; }
  </style>
</head>
<body>

<!-- Header -->
<header class="dash-header">
  <div class="dash-header-left">
    <img src="/static/img/logo.png" alt="DSIRT Logo" class="dash-logo" onerror="this.style.display='none'">
    <div>
      <div class="dash-title">Ph.D Entrance Examination</div>
      <div class="dash-subtitle">Dhanalakshmi Srinivasan Institute of Research and Technology</div>
    </div>
  </div>
  <div class="dash-header-right">
    <span class="candidate-badge" id="candidateNameBadge">Loading…</span>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</header>

<!-- Main content -->
<main class="dash-main">
  <div class="dash-error" id="dashError"></div>
  <div id="dashContent">
    <div class="loading-overlay">
      <div style="width:100%">
        <div class="skeleton skeleton-line" style="width:60%; margin-bottom:12px;"></div>
        <div class="skeleton skeleton-line" style="width:40%; margin-bottom:12px;"></div>
        <div class="skeleton skeleton-line" style="width:80%;"></div>
      </div>
    </div>
  </div>
</main>

<script>
(async () => {
  const token = localStorage.getItem('access_token');
  const role  = localStorage.getItem('role');
  if (!token || role !== 'candidate') { window.location.href = '/login'; return; }

  const nameEl    = document.getElementById('candidateNameBadge');
  const errorEl   = document.getElementById('dashError');
  const contentEl = document.getElementById('dashContent');

  document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/login'; });

  async function api(path) {
    try {
      const res = await fetch(path, { headers: { 'Authorization': `Bearer ${token}` }, cache: 'no-store' });
      if (res.status === 401) { localStorage.removeItem('access_token'); window.location.href = '/login'; return null; }
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  }

  const tz = { timeZone: 'Asia/Kolkata' };
  const fmtIST  = (u) => u ? new Date(u).toLocaleString('en-IN', { ...tz, year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
  const fmtTime = (u) => u ? new Date(u).toLocaleString('en-IN', { ...tz, hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
  const fmtDate = (u) => u ? new Date(u).toLocaleDateString('en-IN', { ...tz, day: '2-digit', month: 'short', year: 'numeric' }) : '';
  function clock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  function escHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

  function phaseBadge(s) {
    const map = {
      not_started: ['not-started', '○ Not started'], in_progress: ['in-progress', '◉ In progress'],
      completed: ['completed', '✓ Submitted'], locked: ['locked', '🔒 Locked'],
      ready: ['in-progress', '▶ Ready to start'], break: ['locked', '☕ Break'],
    };
    const [cls, label] = map[s] || map.locked;
    return `<span class="phase-status-badge ${cls}">${label}</span>`;
  }

  // Local countdowns (re-anchored on every poll so they never drift)
  let countdowns = [];
  function tickCountdowns() {
    countdowns.forEach(c => {
      const el = document.getElementById(c.id);
      if (!el) return;
      const left = Math.ceil((c.endMs - Date.now()) / 1000);
      el.textContent = left > 0 ? clock(left) : (c.doneText || '00:00');
      if (left <= 0 && !c.fired) { c.fired = true; refresh(true); }
    });
  }
  setInterval(tickCountdowns, 1000);

  let lastKey = '';
  function renderDashboard(d, force) {
    nameEl.textContent = d.roll_no ? `${d.full_name} (${d.roll_no})` : d.full_name;
    // Re-render only when something meaningful changed (prevents buttons flickering under the finger)
    const key = JSON.stringify([d.exam_open, d.session_status, d.phase1_status, d.phase2_status, d.scheduled_start_at, d.scheduled_end_at, d.paper2_domain, d.break_seconds_left > 0]);
    const serverOffsetMs = d.server_time ? Date.parse(d.server_time) - Date.now() : 0;
    countdowns = countdowns.filter(() => false);
    const breakEnd = d.phase2_available_at ? Date.parse(d.phase2_available_at) - serverOffsetMs : 0;
    if (d.break_seconds_left > 0) countdowns.push({ id: 'breakCountdown', endMs: Date.now() + d.break_seconds_left * 1000, doneText: 'Phase 2 is open' });
    if (!d.exam_open && d.seconds_until_start > 0) countdowns.push({ id: 'countdownEl', endMs: Date.now() + d.seconds_until_start * 1000, doneText: 'Waiting for the examiner…' });
    if (!force && key === lastKey) return;
    lastKey = key;

    const status = d.session_status || 'not_started';
    const p1 = d.phase1_status || 'not_started';
    const p2 = d.phase2_status || 'locked';
    const open = !!d.exam_open;

    if (status === 'completed' || (status === 'expired')) {
      contentEl.innerHTML = `
        <div class="terminal-notice success">
          <div class="terminal-icon">✅</div>
          <div class="terminal-title" style="color:var(--success-dark)">${status === 'expired' ? 'Examination closed' : 'Examination completed'}</div>
          <div class="terminal-body">Your responses have been recorded.<br>Results will be processed by the examination administrator.<br><br>
            <span style="color:var(--text-faint); font-size:0.82rem">Submitted at: ${fmtIST(d.phase2_submitted_at || d.phase1_submitted_at)}</span></div>
        </div>`;
      return;
    }
    if (status === 'disqualified') {
      contentEl.innerHTML = `
        <div class="terminal-notice disqual">
          <div class="terminal-icon">🚫</div>
          <div class="terminal-title" style="color:var(--danger)">Examination access revoked</div>
          <div class="terminal-body">Your examination was stopped by the examiner.<br><br>Please contact the examination cell.</div>
        </div>`;
      return;
    }

    let ribbon = '';
    if (p2 === 'break') {
      ribbon = `<div class="status-ribbon waiting"><span class="status-dot pulse"></span><span>Phase 1 submitted — break time. Phase 2 opens at ${fmtTime(breakEnd)}.</span></div>
        <div class="countdown-display" id="breakCountdown">--:--</div>
        <div style="font-size:0.8rem; color:var(--text-faint); margin-top:4px">Stay on this page — the Start Phase 2 button unlocks automatically.</div>`;
    } else if (open) {
      ribbon = `<div class="status-ribbon open"><span class="status-dot pulse"></span><span>Examination is LIVE — you may proceed</span></div>`;
    } else if (d.seconds_until_start > 0) {
      ribbon = `<div class="status-ribbon waiting"><span class="status-dot pulse"></span><span>The exam has not started yet — please wait</span></div>
        <div class="countdown-display" id="countdownEl">--:--:--</div>
        <div style="font-size:0.8rem; color:var(--text-faint); margin-top:4px">Scheduled start. The examiner will open the exam — this page updates by itself.</div>`;
    } else {
      ribbon = `<div class="status-ribbon waiting"><span class="status-dot pulse"></span><span>Waiting for the examiner to start the exam. This page updates by itself — no need to refresh.</span></div>`;
    }

    let p1Btn = '', p1Info = '';
    if (p1 === 'completed') {
      p1Info = `<div class="phase-completed-time">Submitted at ${fmtIST(d.phase1_submitted_at)}${d.phase1_auto_submitted ? ' (time over)' : ''}</div>`;
      p1Btn = `<button class="phase-btn phase-btn-done" disabled>✓ Phase 1 submitted</button>`;
    } else if (p1 === 'in_progress') {
      p1Btn = `<button class="phase-btn phase-btn-resume" data-go="1">↩ Resume Phase 1</button>`;
    } else if (open) {
      p1Btn = `<button class="phase-btn phase-btn-start" data-go="1">▶ Start Phase 1</button>`;
    } else {
      p1Btn = `<button class="phase-btn phase-btn-start" disabled>▶ Start Phase 1 (waiting)</button>`;
    }

    let p2Btn = '', p2Info = '';
    if (p2 === 'completed') {
      p2Info = `<div class="phase-completed-time">Submitted at ${fmtIST(d.phase2_submitted_at)}</div>`;
      p2Btn = `<button class="phase-btn phase-btn-done" disabled>✓ Phase 2 submitted</button>`;
    } else if (p2 === 'in_progress') {
      p2Btn = `<button class="phase-btn phase-btn-resume" data-go="2">↩ Resume Phase 2${d.paper2_domain ? ' — ' + escHtml(d.paper2_domain) : ''}</button>`;
    } else if (p2 === 'ready' && open) {
      p2Btn = `<button class="phase-btn phase-btn-start" data-go="2">▶ Start Phase 2</button>`;
    } else if (p2 === 'break') {
      p2Btn = `<button class="phase-btn phase-btn-start" disabled>☕ Opens after the break</button>`;
    } else if (p2 === 'ready') {
      p2Btn = `<button class="phase-btn phase-btn-start" disabled>▶ Start Phase 2 (waiting for examiner)</button>`;
    } else {
      p2Btn = `<button class="phase-btn phase-btn-start" disabled style="opacity:0.35">🔒 Locked</button>`;
    }

    const card = (s) => s === 'in_progress' || s === 'ready' ? 'active-phase' : s === 'completed' ? 'completed-phase' : (s === 'locked' || s === 'break') ? 'locked-phase' : '';

    contentEl.innerHTML = `
      <div class="info-card">
        <div class="info-card-header">
          <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
              <span style="font-family:monospace; font-weight:700; font-size:0.85rem; background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; padding:3px 10px; border-radius:6px;">Roll No: ${escHtml(d.roll_no || '')}</span>
              ${d.registered_domain ? `<span style="font-size:0.8rem; background:#f8fafc; color:#334155; border:1px solid #cbd5e1; padding:3px 10px; border-radius:6px; font-weight:600;">Domain: ${escHtml(d.registered_domain)}</span>` : ''}
            </div>
            <div class="info-candidate-name">${escHtml(d.full_name)}</div>
            <div class="info-candidate-email">${escHtml(d.email)}</div>
          </div>
          <div class="exam-schedule-block">
            <div class="exam-schedule-label">Exam schedule</div>
            <div class="exam-schedule-time">${d.scheduled_start_at ? fmtTime(d.scheduled_start_at) : '—'} – ${d.scheduled_end_at ? fmtTime(d.scheduled_end_at) : '—'}</div>
            <div class="exam-schedule-date">${fmtDate(d.scheduled_start_at)}</div>
          </div>
        </div>
        ${ribbon}
      </div>

      <div class="phases-grid">
        <div class="phase-card ${card(p1)}">
          <div>
            <div class="phase-number">Phase 1</div>
            <div class="phase-title">Research Methodology</div>
            <div class="phase-questions">${d.phase1_count || 50} questions · MCQ · ${d.phase1_minutes} minutes</div>
          </div>
          ${phaseBadge(p1)}${p1Info}${p1Btn}
        </div>
        <div class="phase-card ${card(p2)}">
          <div>
            <div class="phase-number">Phase 2</div>
            <div class="phase-title">Domain Specific</div>
            <div class="phase-questions">50 questions · MCQ · ${d.phase2_minutes} minutes</div>
          </div>
          ${phaseBadge(p2)}${p2Info}${p2Btn}
          ${p2 === 'locked' ? `<div style="font-size:0.78rem; color:#64748b;">Opens ${d.break_minutes} minutes after Phase 1 is submitted</div>` : ''}
        </div>
      </div>

      <div class="notice-card">
        <span>ℹ️</span>
        <div><strong>How it works:</strong> Phase 1 (${d.phase1_minutes} min) → ${d.break_minutes}-minute break (you are signed out) → sign in again → choose your domain → Phase 2 (${d.phase2_minutes} min).
        Answers save automatically. Keep your camera on and do not switch apps during a phase.</div>
      </div>`;

    contentEl.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
      b.disabled = true;
      b.textContent = 'Opening…';
      window.location.href = '/candidate/exam';
    }));
  }

  async function refresh(force) {
    const data = await api('/exam/dashboard');
    if (!data) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Connection problem — retrying automatically…';
      return;
    }
    errorEl.style.display = 'none';
    renderDashboard(data, force);
    tickCountdowns();
  }

  await refresh(true);
  if (!lastKey) contentEl.innerHTML = '';
  setInterval(() => refresh(false), 5000);
})();
</script>
</body>
</html>
